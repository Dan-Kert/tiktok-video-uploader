[project]
name = "tiktok-video-uploader"
version = "1.1"
authors = [
  { name = "DanKert", email = "dankerts@proton.me" },
]
description = "A Python toolkit for uploading videos to TikTok."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = [
	"Selenium",
	"Automation",
	"TikTok",
  "Video",
  "Python",
  "Upload",
  "CLI",
  "Command Line",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
	"playwright>=1.58.0",
	"pydantic>=2.10.6",
  # pytz removed; use stdlib zoneinfo where possible
	"toml>=0.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_video_uploader"]

[project.optional-dependencies]
dev = [
    "freezegun>=0.3.15",
    "mypy>=0.720",
    "pandas-stubs>=2.3.0.250703",
    "pytest>=4.6.11",
    "ruff>=0.0.17",
    "types-pytz>=2025.2.0.20250516",
    "types-toml>=0.10.8.20240310",
]
types = [
    "pandas-stubs>=1.2.0.62",
    "types-pexpect>=4.8.0.1",
    "types-pygments>=2.16.0.0",
    "types-pymysql>=1.1.0.1",
    "types-python-dateutil>=2.8.19.14",
    "types-pytz>=2023.3.1.1",
    "types-requests>=2.31.0.5",
    "types-toml>=0.10.8.7",
]

[project.scripts]
tiktok-uploader = "tiktok_video_uploader.cli:main"
tiktok-auth = "tiktok_video_uploader.cli:auth"

[project.urls]
"Homepage" = "https://github.com/Dan-Kert/tiktok-video-uploader"
"Source Code" = "https://github.com/Dan-Kert/tiktok-video-uploader"
"Bug Tracker" = "https://github.com/Dan-Kert/tiktok-video-uploader/issues"